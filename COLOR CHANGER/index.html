<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="stylesheet" href="style.css" />

    <title>JavaScript Background Color Switcher</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="/" aria-current="page">Home</a>
        <a href="/">About Us</a>
      </nav>
    </header>

    <main class="canvas">
      <h1>Color Scheme Switcher</h1>

      <span class="button" id="grey" title="Grey"></span>
      <span class="button" id="white" title="White"></span>
      <span class="button" id="blue" title="Blue"></span>
      <span class="button" id="yellow" title="Yellow"></span>
      <span class="button" id="red" title="Red"></span>       
      <span class="button" id="green" title="Green"></span>   
      <span class="button" id="purple" title="Purple"></span> 
      <span class="button" id="pink" title="pink"></span>   

      <h2>
        Try clicking on one of the colors above
        <span>to change the background color of this page!</span>
      </h2>
    </main>

    <footer>
      <p> 2025 Color Switcher Demo</p> 
    </footer>

    <script src="ColorChanger.js"></script>    
  </body>
</html>
